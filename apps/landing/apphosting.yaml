# Firebase App Hosting — landing
# Console root directory: apps/landing
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

scripts:
  # Windows-generated lockfiles omit Linux Rollup natives — wipe lock + reinstall on Cloud Build
  buildCommand: rm -rf node_modules package-lock.json && npm install && npm install @rollup/rollup-linux-x64-gnu && npm run build
  runCommand: node dist/server.cjs

outputFiles:
  serverApp:
    include:
      - dist
