# Firebase App Hosting — landing
# Console root directory: apps/landing

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

scripts:
  # Cloud Build runs npm ci first (needs package.json ↔ lock in sync).
  # Then force-install Linux Rollup native (often missing from Windows lock installs).
  buildCommand: npm install --no-save @rollup/rollup-linux-x64-gnu@4.59.0 && npm run build
  runCommand: node dist/server.cjs

outputFiles:
  serverApp:
    include:
      - dist
