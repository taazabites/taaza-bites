# Firebase App Hosting — landing
# Console root directory: apps/landing
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

scripts:
  buildCommand: npm install && npm run build
  runCommand: node dist/server.cjs

outputFiles:
  serverApp:
    include:
      - dist
