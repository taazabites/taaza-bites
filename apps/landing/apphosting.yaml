# Firebase App Hosting — landing
# Console root directory: apps/landing
#
# No package-lock.json in this app: Cloud Build uses `npm install` (not `npm ci`),
# which correctly installs Linux native optional deps (rollup, lightningcss, etc.).

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

scripts:
  buildCommand: npm run build
  runCommand: node dist/server.cjs

outputFiles:
  serverApp:
    include:
      - dist
