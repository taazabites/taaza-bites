# Firebase App Hosting — landing
# Console root directory: apps/landing

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

scripts:
  # npm ci may skip some natives; reinstall so Linux optionalDeps are present
  buildCommand: rm -rf node_modules && npm install && npm run build
  runCommand: node dist/server.cjs

outputFiles:
  serverApp:
    include:
      - dist
