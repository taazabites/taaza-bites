# Firebase App Hosting — landing
# Console root directory: apps/landing
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

scripts:
  # Reinstall after Cloud Build's npm ci — Windows lockfiles omit Linux Rollup optional deps
  buildCommand: rm -rf node_modules && npm install && npm run build
  runCommand: node dist/server.cjs

outputFiles:
  serverApp:
    include:
      - dist
