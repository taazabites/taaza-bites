# Firebase App Hosting — admin
# Console root directory: apps/admin

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

scripts:
  buildCommand: npm install --no-save @rollup/rollup-linux-x64-gnu@4.59.0 && npm run build
  runCommand: node dist/server.cjs

outputFiles:
  serverApp:
    include:
      - dist

env:
  - variable: VITE_BASE
    value: /
    availability:
      - BUILD
