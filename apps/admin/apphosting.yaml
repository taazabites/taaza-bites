# Firebase App Hosting — admin
# Console root directory: apps/admin
#
# No package-lock.json: Cloud Build uses platform-correct `npm install`.

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

scripts:
  buildCommand: npm run build
  runCommand: node dist/server.cjs

outputFiles:
  serverApp:
    include:
      - dist

env:
  - variable: VITE_BASE
    value: /
    availability:
      - BUILD
