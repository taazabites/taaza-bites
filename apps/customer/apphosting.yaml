# Firebase App Hosting — customer
# Firebase Console → App Hosting → Backend → Root directory: apps/customer

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

scripts:
  # Monorepo: install from repo root, build this workspace package
  buildCommand: cd ../.. && npm ci && npm run build -w @taazabites/customer
  runCommand: node dist/server.cjs

outputFiles:
  serverApp:
    include:
      - dist

env:
  - variable: VITE_BASE
    value: /
    availability:
      - BUILD
