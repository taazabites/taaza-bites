# Firebase App Hosting — customer
# Firebase Console → App Hosting → Backend → Root directory: apps/customer

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

scripts:
  # Monorepo: install from repo root (workspace lockfile), then copy runtime
  # node_modules into this app. dist/server.cjs is built with --packages=external.
  buildCommand: cd ../.. && npm ci && npm run build -w @taazabites/customer && mkdir -p apps/customer/node_modules && cp -a node_modules/. apps/customer/node_modules/
  runCommand: node dist/server.cjs

outputFiles:
  serverApp:
    include:
      - dist
      - node_modules

env:
  - variable: VITE_BASE
    value: /
    availability:
      - BUILD
  - variable: FIRESTORE_DATABASE_ID
    value: ai-studio-taazabitessubscr-4d42449d-94e2-49b8-84ea-c7c481d0d5f9
    availability:
      - RUNTIME
