# Firebase App Hosting — customer
# Firebase Console → App Hosting → Backend → Root directory: apps/customer

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

scripts:
  buildCommand: >-
    cd ../.. &&
    npm ci &&
    npm run build -w @taazabites/customer &&
    cd apps/customer &&
    npm install --omit=dev --install-strategy=nested &&
    node -e "console.log('compression:', require.resolve('compression')); console.log('express:', require.resolve('express')); console.log('dotenv:', require.resolve('dotenv')); console.log('firebase-admin:', require.resolve('firebase-admin'))"
  runCommand: node dist/server.cjs

outputFiles:
  serverApp:
    include:
      - dist
      - node_modules

env:
  - variable: VITE_BASE
    value: /
    availability:
      - BUILD
  - variable: FIRESTORE_DATABASE_ID
    value: ai-studio-taazabitessubscr-4d42449d-94e2-49b8-84ea-c7c481d0d5f9
    availability:
      - RUNTIME
