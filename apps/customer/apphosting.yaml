# Firebase App Hosting — customer
# Firebase Console → App Hosting → Backend → Root directory: apps/customer

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

scripts:
  buildCommand: >-
    cd ../.. &&
    npm ci &&
    npm run build -w @taazabites/customer &&
    rm -rf node_modules &&
    npm install --prefix apps/customer --omit=dev --workspaces=false --install-strategy=nested --no-package-lock &&
    test ! -L apps/customer/node_modules/compression &&
    test ! -L apps/customer/node_modules/express &&
    node -e "console.log('compression:', require.resolve('./apps/customer/node_modules/compression')); console.log('express:', require.resolve('./apps/customer/node_modules/express')); console.log('dotenv:', require.resolve('./apps/customer/node_modules/dotenv')); console.log('firebase-admin:', require.resolve('./apps/customer/node_modules/firebase-admin'))"
  runCommand: node dist/server.cjs

outputFiles:
  serverApp:
    include:
      - dist
      - node_modules

env:
  - variable: VITE_BASE
    value: /
    availability:
      - BUILD
  - variable: FIRESTORE_DATABASE_ID
    value: ai-studio-taazabitessubscr-4d42449d-94e2-49b8-84ea-c7c481d0d5f9
    availability:
      - RUNTIME
