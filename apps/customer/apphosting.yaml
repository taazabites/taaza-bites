# Firebase App Hosting — customer
# Console root directory: apps/customer

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

scripts:
  buildCommand: rm -rf node_modules && npm install && npm run build
  runCommand: node dist/server.cjs

outputFiles:
  serverApp:
    include:
      - dist

env:
  - variable: VITE_BASE
    value: /
    availability:
      - BUILD
